<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">OpenVerb app icon</title>
  <desc id="desc">A macOS-style app icon with an OpenVerb waveform shaped like a narrow leaf.</desc>

  <defs>
    <linearGradient id="paper" x1="86" y1="48" x2="426" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFEF7"/>
      <stop offset="0.55" stop-color="#F6F3E8"/>
      <stop offset="1" stop-color="#E4DCC8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 146) rotate(50) scale(376)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#E5EDD9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5D718D" stop-opacity="0.08"/>
    </radialGradient>
    <linearGradient id="iconWaveLeaf" x1="102" y1="286" x2="410" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#314B2A"/>
      <stop offset="0.5" stop-color="#6F8A58"/>
      <stop offset="1" stop-color="#D87445"/>
    </linearGradient>
    <linearGradient id="iconVein" x1="112" y1="378" x2="400" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#243B21" stop-opacity="0.9"/>
      <stop offset="0.72" stop-color="#496C3A" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#D87445" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="rim" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#314B2A" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <rect x="16" y="24" width="480" height="472" rx="106" fill="#172113" opacity="0.12"/>
  <rect width="512" height="512" rx="112" fill="url(#paper)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <g clip-path="url(#squircle)">
    <ellipse cx="210" cy="330" rx="210" ry="168" fill="#DCE9D5" opacity="0.45"/>
    <g transform="translate(256 256) rotate(-38) translate(-256 -256)" stroke-linecap="round">
      <path d="M108 256H404" stroke="url(#iconVein)" stroke-width="16"/>
      <g stroke="url(#iconWaveLeaf)" stroke-width="25">
        <path d="M112 250V262"/>
        <path d="M144 226V286"/>
        <path d="M176 190V322"/>
        <path d="M208 154V358"/>
        <path d="M240 126V386"/>
        <path d="M272 134V378"/>
        <path d="M304 166V346"/>
        <path d="M336 202V310"/>
        <path d="M368 234V278"/>
        <path d="M400 252V260"/>
      </g>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" stroke="url(#rim)" stroke-width="3"/>
  <path d="M72 20Q256 0 440 20L426 58Q256 42 86 58Z" fill="#FFFFFF" opacity="0.38"/>
</svg>
